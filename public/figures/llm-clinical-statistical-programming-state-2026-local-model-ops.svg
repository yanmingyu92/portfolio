<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="system-ui, -apple-system, sans-serif">
  <rect width="700" height="330" fill="#fafaf9"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#1c1917">admiral code generation: Overall Performance Score (OPS)</text>

  <!-- Gridlines: 0 to 1.0 over 480px, from x=170 -->
  <line x1="170" y1="50" x2="170" y2="235" stroke="#d6d3d1" stroke-width="1"/>
  <line x1="290" y1="50" x2="290" y2="235" stroke="#e7e5e4" stroke-width="1"/>
  <line x1="410" y1="50" x2="410" y2="235" stroke="#e7e5e4" stroke-width="1"/>
  <line x1="530" y1="50" x2="530" y2="235" stroke="#e7e5e4" stroke-width="1"/>
  <line x1="650" y1="50" x2="650" y2="235" stroke="#d6d3d1" stroke-width="1"/>
  <text x="170" y="254" text-anchor="middle" font-size="12" fill="#78716c">0</text>
  <text x="290" y="254" text-anchor="middle" font-size="12" fill="#78716c">0.25</text>
  <text x="410" y="254" text-anchor="middle" font-size="12" fill="#78716c">0.50</text>
  <text x="530" y="254" text-anchor="middle" font-size="12" fill="#78716c">0.75</text>
  <text x="650" y="254" text-anchor="middle" font-size="12" fill="#78716c">1.0</text>

  <!-- GPT-4o -->
  <text x="160" y="77" text-anchor="end" font-size="13" font-weight="600" fill="#1c1917">GPT-4o</text>
  <text x="160" y="92" text-anchor="end" font-size="11" fill="#78716c">cloud API</text>
  <rect x="170" y="64" width="437" height="30" rx="4" fill="#44403c"/>
  <text x="614" y="84" font-size="14" font-weight="600" fill="#1c1917">0.91</text>

  <!-- Llama 3.1 8B + LoRA -->
  <text x="160" y="131" text-anchor="end" font-size="13" font-weight="600" fill="#9f1239">Llama 3.1 8B + LoRA</text>
  <text x="160" y="146" text-anchor="end" font-size="11" fill="#78716c">local, workstation GPU</text>
  <rect x="170" y="118" width="394" height="30" rx="4" fill="#9f1239"/>
  <text x="571" y="138" font-size="14" font-weight="600" fill="#9f1239">0.82</text>
  <!-- complex-derivation marker at 0.76 -->
  <line x1="535" y1="112" x2="535" y2="154" stroke="#9f1239" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="528" y="110" text-anchor="end" font-size="12" fill="#9f1239">complex derivations: 0.76</text>

  <!-- Llama 3.1 8B stock -->
  <text x="160" y="185" text-anchor="end" font-size="13" font-weight="600" fill="#57534e">Llama 3.1 8B, stock</text>
  <text x="160" y="200" text-anchor="end" font-size="11" fill="#78716c">local</text>
  <rect x="170" y="172" width="173" height="30" rx="4" fill="#a8a29e"/>
  <text x="350" y="192" font-size="14" font-weight="600" fill="#57534e">0.36</text>

  <text x="410" y="278" text-anchor="middle" font-size="12.5" fill="#78716c">Overall Performance Score, 0&#8211;1 (75 ADaM variables, 6 domains, 3 complexity tiers)</text>

  <line x1="20" y1="294" x2="680" y2="294" stroke="#d6d3d1" stroke-width="1"/>
  <text x="20" y="314" font-size="12.5" fill="#1c1917">LoRA fine-tuning on knowledge-graph-filtered examples closes most of the gap to the cloud frontier model [4];</text>
  <text x="20" y="330" font-size="12.5" fill="#1c1917">the dashed marker is the complex-derivation ceiling, where human review stays mandatory.</text>
</svg>
