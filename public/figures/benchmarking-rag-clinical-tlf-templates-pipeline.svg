<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="system-ui, -apple-system, sans-serif">
  <rect width="700" height="230" fill="#fafaf9"/>

  <!-- Agent boxes -->
  <g>
    <rect x="10" y="30" width="148" height="80" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
    <text x="84" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">1. Query</text>
    <text x="84" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">analysis</text>
    <text x="84" y="97" text-anchor="middle" font-size="13" fill="#1c1917">complexity L1–L5</text>
  </g>
  <g>
    <rect x="186" y="30" width="148" height="80" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
    <text x="260" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">2. Template</text>
    <text x="260" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">generation</text>
    <text x="260" y="97" text-anchor="middle" font-size="13" fill="#9f1239">hybrid RAG + rerank</text>
  </g>
  <g>
    <rect x="362" y="30" width="148" height="80" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
    <text x="436" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">3. R code</text>
    <text x="436" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">generation</text>
    <text x="436" y="97" text-anchor="middle" font-size="13" fill="#1c1917">zero-shot draft</text>
  </g>
  <g>
    <rect x="538" y="30" width="148" height="80" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
    <text x="612" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">4. Execute &amp;</text>
    <text x="612" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">debug</text>
    <text x="612" y="97" text-anchor="middle" font-size="13" fill="#1c1917">exit 0 + shape checks</text>
  </g>

  <!-- Forward arrows -->
  <g stroke="#9f1239" stroke-width="2" fill="#9f1239">
    <line x1="158" y1="70" x2="182" y2="70"/>
    <polygon points="182,70 174,65 174,75"/>
    <line x1="334" y1="70" x2="358" y2="70"/>
    <polygon points="358,70 350,65 350,75"/>
    <line x1="510" y1="70" x2="534" y2="70"/>
    <polygon points="534,70 526,65 526,75"/>
  </g>

  <!-- Feedback loop: debug -> code generation -->
  <g stroke="#9f1239" stroke-width="2" fill="none">
    <path d="M 612 110 L 612 160 L 436 160 L 436 114"/>
  </g>
  <polygon points="436,110 431,120 441,120" fill="#9f1239"/>
  <text x="512" y="174" text-anchor="middle" font-size="13" fill="#9f1239">minimal patch on failure,</text>
  <text x="512" y="190" text-anchor="middle" font-size="13" fill="#9f1239">up to 14 rounds</text>

  <!-- Success exit -->
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <path d="M 660 110 L 660 150"/>
  </g>
  <polygon points="660,156 655,146 665,146" fill="#1c1917"/>
  <text x="648" y="172" text-anchor="middle" font-size="13" fill="#1c1917">validated</text>
  <text x="648" y="188" text-anchor="middle" font-size="13" fill="#1c1917">R script</text>
</svg>
